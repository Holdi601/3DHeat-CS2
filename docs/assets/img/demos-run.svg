<rect width="609" height="26" rx="8" fill="#2c2e35"/><rect y="18" width="609" height="8" fill="#2c2e35"/>
<circle cx="16" cy="13" r="5" fill="#ff5f57"/><circle cx="32" cy="13" r="5" fill="#febc2e"/><circle cx="48" cy="13" r="5" fill="#28c840"/>
<text x="304.5" y="17" fill="#9aa0aa" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">demos: one .3dheat file a match (synthetic demo)</text>
<g font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13" xml:space="preserve">
<text x="16" y="46" fill="#7ee787">$ python -m heat3d_cs2 demos demos -o out</text>
