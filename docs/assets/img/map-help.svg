<text x="343.5" y="17" fill="#9aa0aa" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">$ python -m heat3d_cs2 map --help</text>
<g font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13" xml:space="preserve" style="white-space:pre">
<text x="16" y="46" fill="#7ee787" xml:space="preserve" style="white-space:pre">$&#160;python&#160;-m&#160;heat3d_cs2&#160;map&#160;--help</text>
<text x="16" y="64" fill="#d6d9df" xml:space="preserve" style="white-space:pre">usage:&#160;heat3d_cs2&#160;map&#160;[-h]&#160;-o&#160;OUT&#160;[--game&#160;GAME]&#160;[--source2viewer&#160;SOURCE2VIEWER]&#160;name</text>
<text x="16" y="82" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="100" fill="#d6d9df" xml:space="preserve" style="white-space:pre">positional&#160;arguments:</text>
<text x="16" y="118" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;name&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;the&#160;map&#x27;s&#160;name&#160;(like&#160;de_x)&#160;or&#160;the&#160;path&#160;to&#160;its&#160;.vpk</text>
<text x="16" y="136" fill="#d6d9df" xml:space="preserve" style="white-space:pre"></text>
<text x="16" y="154" fill="#d6d9df" xml:space="preserve" style="white-space:pre">options:</text>
<text x="16" y="172" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-h,&#160;--help&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;show&#160;this&#160;help&#160;message&#160;and&#160;exit</text>
<text x="16" y="190" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;-o,&#160;--out&#160;OUT&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;.glb&#160;to&#160;write</text>
<text x="16" y="208" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--game&#160;GAME&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;the&#160;CS2&#160;install&#160;folder,&#160;when&#160;Steam&#160;does&#160;not&#160;know&#160;it</text>
<text x="16" y="226" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;--source2viewer&#160;SOURCE2VIEWER</text>
<text x="16" y="244" fill="#d6d9df" xml:space="preserve" style="white-space:pre">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Source2Viewer-CLI&#160;executable,&#160;when&#160;it&#160;is&#160;not&#160;on&#160;PATH</text>
