<svg xmlns="http://www.w3.org/2000/svg" width="624" height="302" viewBox="0 0 624 302" role="img" aria-label="map --help">
<rect width="624" height="302" rx="8" fill="#1e1f24"/>
<rect width="624" height="26" rx="8" fill="#2c2e35"/><rect y="18" width="624" height="8" fill="#2c2e35"/>
<circle cx="16" cy="13" r="5" fill="#ff5f57"/><circle cx="32" cy="13" r="5" fill="#febc2e"/><circle cx="48" cy="13" r="5" fill="#28c840"/>
<text x="312.0" y="17" fill="#9aa0aa" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">map --help</text>
<g font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" font-size="13" xml:space="preserve">
<text x="16" y="46" fill="#7ee787">$ python -m heat3d_cs2 map --help</text>
<text x="16" y="64" fill="#d6d9df">usage: heat3d_cs2 map [-h] -o OUT [--game GAME]</text>
<text x="16" y="82" fill="#d6d9df">                      [--source2viewer SOURCE2VIEWER]</text>
<text x="16" y="100" fill="#d6d9df">                      name</text>
<text x="16" y="118" fill="#d6d9df"></text>
<text x="16" y="136" fill="#d6d9df">positional arguments:</text>
<text x="16" y="154" fill="#d6d9df">  name                  map name (de_mirage) or the path to its .vpk</text>
<text x="16" y="172" fill="#d6d9df"></text>
<text x="16" y="190" fill="#d6d9df">options:</text>
<text x="16" y="208" fill="#d6d9df">  -h, --help            show this help message and exit</text>
<text x="16" y="226" fill="#d6d9df">  -o, --out OUT         .glb to write</text>
<text x="16" y="244" fill="#d6d9df">  --game GAME           the CS2 install folder, when Steam does not know it</text>
<text x="16" y="262" fill="#d6d9df">  --source2viewer SOURCE2VIEWER</text>
<text x="16" y="280" fill="#d6d9df">                        Source2Viewer-CLI executable, when it is not on PATH</text>
</g></svg>
