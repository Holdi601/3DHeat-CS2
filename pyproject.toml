[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heat3d-cs2"
version = "1.2.0"
description = "Counter-Strike 2 demos into the tables the 3DHeat viewer reads, and the maps of your CS2 install into .glb levels"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Holdi601" }]
requires-python = ">=3.10"
dependencies = ["demoparser2>=0.42", "pyarrow>=15", "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "fast-simplification>=0.1"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["heat3d_cs2", "heat3d_cs2.app", "heat3d_update"]
